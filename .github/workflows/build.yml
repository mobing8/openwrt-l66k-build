name: Build OpenWrt L66K Firmware

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      ssh_debug:
        description: 'SSH debug mode'
        required: false
        default: 'false'

env:
  REPO_URL: https://gitee.com/qiming-zhixian/openwrt-24-open.git
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: config/l66k.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /opt/hostedtoolcache/go
        sudo rm -rf /opt/hostedtoolcache/node
        sudo rm -rf /opt/hostedtoolcache/PyPy
        sudo rm -rf /opt/hostedtoolcache/Ruby
        sudo rm -rf /opt/hostedtoolcache/Terraform
        sudo docker image prune -a -f
        df -h

    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget ca-certificates python3-setuptools xsltproc
        echo "依赖安装完成"

    - name: Clone source code
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "源码克隆完成，commit: $(git rev-parse --short HEAD)"

    - name: Load custom feeds
      run: |
        cd openwrt
        # 备份默认 feeds
        cp feeds.conf.default feeds.conf.default.bak
        # 添加 OpenClash feed
        echo "src-git openclash https://github.com/vernesong/OpenClash.git;master" >> feeds.conf.default
        # 添加 QModem feed
        echo "src-git qmodem https://github.com/FUjr/QModem.git;main" >> feeds.conf.default
        cat feeds.conf.default

    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a 2>&1 | tail -20
        ./scripts/feeds install -a 2>&1 | tail -20
        echo "feeds 安装完成"

    - name: Load custom configuration
      run: |
        cd openwrt
        # 复制风扇控制包
        cp -rf ../package/luci-app-fan package/luci-app-fan
        # 复制 uci-defaults 自定义设置
        mkdir -p files/etc/uci-defaults
        cp -f ../files/etc/uci-defaults/99-custom-settings files/etc/uci-defaults/99-custom-settings
        chmod +x files/etc/uci-defaults/99-custom-settings
        # 基于 L66K 默认配置 + 增量配置
        cp -f zxconfig/L66K .config
        cat ../config/l66k.config >> .config
        make defconfig
        echo "配置加载完成"
        echo "=== 关键包确认 ==="
        grep -E 'CONFIG_PACKAGE_(luci-app-openclash|qmodem|luci-app-qmodem-next|luci-app-fan|luci-theme-argon|luci-i18n-base-zh-cn|sendat|kmod-usb-net-qmi-wwan)=' .config || true

    - name: SSH debug (optional)
      if: github.event.inputs.ssh_debug == 'true'
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 60

    - name: Download packages
      run: |
        cd openwrt
        make download -j8 V=s 2>&1 | tail -30
        echo "源码包下载完成"

    - name: Compile firmware
      run: |
        cd openwrt
        echo "开始编译，CPU: $(nproc) 核"
        make -j$(nproc) V=s 2>&1 | tail -100
        echo "编译完成"

    - name: Check build output
      if: always()
      run: |
        cd openwrt
        echo "=== bin 目录 ==="
        find bin/ -type f -name "*.bin" -o -name "*.itb" -o -name "*.img" 2>/dev/null | head -30
        echo "=== 编译日志末尾 ==="
        ls -la bin/targets/mediatek/filogic/ 2>/dev/null || echo "目标目录不存在"

    - name: Upload firmware to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-L66K-firmware
        path: |
          openwrt/bin/targets/mediatek/filogic/*
          openwrt/bin/packages/**
        retention-days: 30
        if-no-files-found: warn
